---
- name: Deploy WAR to Tomcat
  hosts: localhost
  become: yes
  vars:
    new_war_src: files/sample.war        # path on controller relative to playbook
    new_war_name: sample.war
    app_context: sample                  # context path used in health check
    tomcat_http_port: 9090
    backup_dir: /tmp/tomcat_backups
    webapps_dir: /var/lib/tomcat10/webapps
    tomcat_service: tomcat10
    tomcat_user: tomcat

  tasks:
    - name: Ensure tomcat10 webapps directory exists
      ansible.builtin.stat:
        path: "{{ webapps_dir }}"
      register: webapps_dir_stat

    - name: Fail if tomcat10 webapps directory not found
      ansible.builtin.fail:
        msg: "Tomcat 10 webapps directory {{ webapps_dir }} not found on target."
      when: not webapps_dir_stat.stat.exists

    - name: Check if existing WAR is present
      ansible.builtin.stat:
        path: "{{ webapps_dir }}/{{ new_war_name }}"
      register: existing_war

    - name: Stop Tomcat service
      ansible.builtin.service:
        name: "{{ tomcat_service }}"
        state: stopped

    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ backup_dir }}/{{ ansible_date_time.iso8601_basic }}"
        state: directory
        mode: '0755'
      register: backup_path

    - name: Backup existing WAR if present
      ansible.builtin.copy:
        src: "{{ webapps_dir }}/{{ new_war_name }}"
        dest: "{{ backup_dir }}/{{ ansible_date_time.iso8601_basic }}/"
        remote_src: yes
      when: existing_war.stat.exists

    - name: Remove exploded app directory if present
      ansible.builtin.file:
        path: "{{ webapps_dir }}/{{ app_context }}"
        state: absent

    - name: Deploy new WAR file
      ansible.builtin.copy:
        src: "{{ new_war_src }}"
        dest: "{{ webapps_dir }}/{{ new_war_name }}"
        owner: "{{ tomcat_user | default(omit) }}"
        mode: '0644'

    - name: Start Tomcat service
      ansible.builtin.service:
        name: "{{ tomcat_service }}"
        state: started
        enabled: yes

    - name: Wait for Tomcat to listen on port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ tomcat_http_port }}"
        timeout: 30

    - name: Health check deployed application
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ tomcat_http_port }}/{{ app_context }}/"
        status_code: 200
        return_content: no
      register: app_check
      failed_when: app_check.status != 200

    - name: Show health check result
      ansible.builtin.debug:
        msg: "Application responded with status {{ app_check.status }}"
